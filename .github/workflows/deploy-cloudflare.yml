name: Deploy website to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-static-deploy.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: missionary-media-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tooling
        run: npm ci
      - name: Check deployable source
        run: |
          node --check public/assets/site.js
          node --check scripts/verify-static-deploy.mjs
          git diff --exit-code
          npm run check:deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Deploy public assets
        run: npm run deploy -- --message "GitHub commit ${GITHUB_SHA}" --tag "${GITHUB_SHA:0:7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify remote bytes and security headers
        run: node scripts/verify-static-deploy.mjs https://missionary-media-website.tabor-empoweringothers.workers.dev
